; PlatformIO build configuration for the secondary ESP32-WROOM-32 development board.
; Open this folder in Visual Studio Code with the PlatformIO IDE extension.

[platformio]
default_envs = esp32_wroom_32

[env:esp32_wroom_32]
platform = espressif32@7.1.3
board = esp32dev
framework = arduino
upload_speed = 115200
monitor_speed = 115200
build_flags = -I../shared
lib_deps = autowp/autowp-mcp2515@1.3.1

; Select explicitly after dry-run checks; uploading this build enables real SMS.
[env:esp32_wroom_32_real_sms]
extends = env:esp32_wroom_32
build_flags =
    ${env:esp32_wroom_32.build_flags}
    -DBSM_SEND_REAL_SMS=1

; Standalone bench test: no modem, primary commands, or external CAN transmission.
[env:esp32_wroom_32_mcp_diagnostic]
extends = env:esp32_wroom_32
build_src_filter = +<main.cpp> +<mcp_diagnostic.cpp>
build_flags =
    ${env:esp32_wroom_32.build_flags}
    -DBSM_MCP_DIAGNOSTIC=1
